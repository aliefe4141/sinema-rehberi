<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sepetim</title>
    <link rel="stylesheet" href="stil.css">
</head>
<body>
    <header>
        <h1>Sinema Bilet ve Seans Rehberi</h1>
        <nav>
            <a href="index.html">Ana Sayfa</a> |
            <a href="filmler.html">Filmler</a> |
            <a href="sinemalar.html">Sinemalar</a> |
            <a href="kampanyalar.html">Kampanyalar</a> |
            <a href="sepetim.html">Sepetim</a>
        </nav>
    </header>


<main>
    <section class="sepet-alani">
        <h2>Bilet Sepetim</h2>
        
        <div class="sepet-icerik">
            <!-- Sepet Boşsa Gösterilecek Mesaj (Şu an gizli olucak) -->
            <p class="bos-sepet-mesaji" style="display: none;">Sepetinizde henüz bilet bulunmuyor.</p>

            <!-- Sepete Eklenmiş Örnek Bilet (Arayüz tasarımı için) -->
            <div class="sepet-ogesi">
                <div class="bilet-detay">
                    <h3>Korku Kapanı</h3>
                    <p>Büyülü Fener Sineması - Kızılay | 18:15 Seansı</p>
                    <p>Bilet Türü: Tam (120 ₺)</p>
                </div>
                
                <div class="bilet-islem">
                    <!-- Bilet sayısı güncelleme (CRUD - Update) -->
                    <div class="adet-kontrol">
                        <label>Adet:</label>
                        <input type="number" value="1" min="1" max="10">
                    </div>
                    <!-- Bilet silme butonu (CRUD - Delete) -->
                    <button class="sil-btn">Sil</button>
                </div>
            </div>
        </div>

        <div class="sepet-ozeti">
            <h3>Toplam Tutar: <span id="toplam-fiyat">120 ₺</span></h3>
            <button class="satin-al-btn">Biletleri Onayla</button>
        </div>
    </section>
</main>

   
    <footer>
        <p>&copy; 2026 Ali Efe Boz - Tüm Hakları Saklıdır.</p>
    </footer>
</body>
</html>
